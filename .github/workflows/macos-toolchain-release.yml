name: macOS Toolchain Protected Release Rehearsal

on:
  workflow_dispatch:
    inputs:
      producer_commit:
        description: Exact default-branch commit to build
        required: true
        type: string
      mupdf_version:
        description: Exact pinned MuPDF version
        required: true
        default: '1.27.2'
        type: string
      qpdf_version:
        description: Exact pinned qpdf version
        required: true
        default: '12.3.2'
        type: string
      release_revision:
        description: Exact approved packaging revision
        required: true
        default: 'r1'
        type: string

permissions:
  contents: read

concurrency:
  group: macos-toolchain-protected-release
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate exact default-branch release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the requested producer commit without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.producer_commit }}
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Refuse branch, commit, version, or revision drift
        env:
          REQUESTED_COMMIT: ${{ inputs.producer_commit }}
          DISPATCH_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MUPDF_VERSION: ${{ inputs.mupdf_version }}
          QPDF_VERSION: ${{ inputs.qpdf_version }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
        run: >-
          bun toolchain:verify-release-inputs
          --ref "$GITHUB_REF"
          --default-branch "$DEFAULT_BRANCH"
          --checked-out-commit "$(git rev-parse HEAD)"
          --dispatch-commit "$DISPATCH_COMMIT"
          --requested-commit "$REQUESTED_COMMIT"
          --mupdf-version "$MUPDF_VERSION"
          --qpdf-version "$QPDF_VERSION"
          --revision "$RELEASE_REVISION"

  build-sign-notarize:
    name: Sign and notarize ${{ matrix.architecture }} candidates
    needs: validate-inputs
    environment: macos-toolchain-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - name: Check out the exact producer commit without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.producer_commit }}
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Build once, sign with hardened runtime, package once, and notarize the exact ZIPs
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          : "${SIGNING_CERTIFICATE_P12_BASE64:?missing protected signing certificate}"
          : "${SIGNING_CERTIFICATE_PASSWORD:?missing protected signing certificate password}"
          : "${DEVELOPER_ID_APPLICATION:?missing protected Developer ID identity}"
          : "${APPLE_TEAM_ID:?missing protected Apple Team ID}"
          : "${NOTARY_KEY_P8_BASE64:?missing protected notary API key}"
          : "${NOTARY_KEY_ID:?missing protected notary key ID}"
          : "${NOTARY_ISSUER_ID:?missing protected notary issuer ID}"
          CERTIFICATE_PATH="$RUNNER_TEMP/autoshow-developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/autoshow-notary-key.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/autoshow-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"
          }
          trap cleanup EXIT
          printf '%s' "$SIGNING_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          bun toolchain:produce-signed \
            --architecture "$ARCHITECTURE" \
            --work-dir "$RUNNER_TEMP/macos-toolchain-signed-build" \
            --output-dir "$RUNNER_TEMP/macos-toolchain-signed-artifacts" \
            --signing-identity "$DEVELOPER_ID_APPLICATION" \
            --team-id "$APPLE_TEAM_ID" \
            --notary-key "$NOTARY_KEY_PATH" \
            --notary-key-id "$NOTARY_KEY_ID" \
            --notary-issuer-id "$NOTARY_ISSUER_ID"

      - name: Attest MuPDF ZIP and SBOM provenance
        id: mupdf_provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ runner.temp }}/macos-toolchain-signed-artifacts/autoshow-mupdf-1.27.2-r1-darwin-${{ matrix.architecture }}.zip
            ${{ runner.temp }}/macos-toolchain-signed-artifacts/autoshow-mupdf-1.27.2-r1-darwin-${{ matrix.architecture }}.spdx.json

      - name: Retain MuPDF provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.mupdf_provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/macos-toolchain-signed-artifacts/autoshow-mupdf-1.27.2-r1-darwin-${{ matrix.architecture }}.provenance.intoto.jsonl"

      - name: Attest the MuPDF ZIP against its SPDX SBOM
        id: mupdf_sbom
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/macos-toolchain-signed-artifacts/autoshow-mupdf-1.27.2-r1-darwin-${{ matrix.architecture }}.zip
          sbom-path: ${{ runner.temp }}/macos-toolchain-signed-artifacts/autoshow-mupdf-1.27.2-r1-darwin-${{ matrix.architecture }}.spdx.json

      - name: Retain MuPDF SBOM attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.mupdf_sbom.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/macos-toolchain-signed-artifacts/autoshow-mupdf-1.27.2-r1-darwin-${{ matrix.architecture }}.sbom.intoto.jsonl"

      - name: Attest qpdf ZIP and SBOM provenance
        id: qpdf_provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            ${{ runner.temp }}/macos-toolchain-signed-artifacts/autoshow-qpdf-12.3.2-r1-darwin-${{ matrix.architecture }}.zip
            ${{ runner.temp }}/macos-toolchain-signed-artifacts/autoshow-qpdf-12.3.2-r1-darwin-${{ matrix.architecture }}.spdx.json

      - name: Retain qpdf provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.qpdf_provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/macos-toolchain-signed-artifacts/autoshow-qpdf-12.3.2-r1-darwin-${{ matrix.architecture }}.provenance.intoto.jsonl"

      - name: Attest the qpdf ZIP against its SPDX SBOM
        id: qpdf_sbom
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/macos-toolchain-signed-artifacts/autoshow-qpdf-12.3.2-r1-darwin-${{ matrix.architecture }}.zip
          sbom-path: ${{ runner.temp }}/macos-toolchain-signed-artifacts/autoshow-qpdf-12.3.2-r1-darwin-${{ matrix.architecture }}.spdx.json

      - name: Retain qpdf SBOM attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.qpdf_sbom.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/macos-toolchain-signed-artifacts/autoshow-qpdf-12.3.2-r1-darwin-${{ matrix.architecture }}.sbom.intoto.jsonl"

      - name: Record exact protected-job checksums
        run: >-
          bun toolchain:write-checksums
          --artifacts-dir "$RUNNER_TEMP/macos-toolchain-signed-artifacts"
          --output "$RUNNER_TEMP/macos-toolchain-signed-artifacts/PROTECTED-SHA256SUMS"

      - name: Upload signed rehearsal candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-toolchain-signed-${{ matrix.architecture }}
          path: ${{ runner.temp }}/macos-toolchain-signed-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  clean-quarantine:
    name: Quarantine and Gatekeeper ${{ matrix.architecture }} candidates
    needs: build-sign-notarize
    environment: macos-toolchain-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact consumer commit without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.producer_commit }}
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Download the exact signed architecture bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-toolchain-signed-${{ matrix.architecture }}
          path: ${{ runner.temp }}/macos-toolchain-signed-artifacts

      - name: Verify protected-job checksums and attestations
        working-directory: ${{ runner.temp }}/macos-toolchain-signed-artifacts
        env:
          PRODUCER_COMMIT: ${{ inputs.producer_commit }}
        run: |
          shasum -a 256 -c PROTECTED-SHA256SUMS
          for tool in mupdf qpdf; do
            if [ "$tool" = mupdf ]; then version=1.27.2; else version=12.3.2; fi
            base="autoshow-$tool-$version-r1-darwin-${{ matrix.architecture }}"
            gh attestation verify "$base.zip" --repo "$GITHUB_REPOSITORY" --bundle "$base.provenance.intoto.jsonl" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/macos-toolchain-release.yml" --source-ref refs/heads/main --source-digest "$PRODUCER_COMMIT"
            gh attestation verify "$base.spdx.json" --repo "$GITHUB_REPOSITORY" --bundle "$base.provenance.intoto.jsonl" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/macos-toolchain-release.yml" --source-ref refs/heads/main --source-digest "$PRODUCER_COMMIT"
            gh attestation verify "$base.zip" --repo "$GITHUB_REPOSITORY" --bundle "$base.sbom.intoto.jsonl" --predicate-type https://spdx.dev/Document/v2.3 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/macos-toolchain-release.yml" --source-ref refs/heads/main --source-digest "$PRODUCER_COMMIT"
          done

      - name: Install with quarantine intact and require Gatekeeper acceptance
        run: >-
          bun toolchain:verify-signed
          --architecture "${{ matrix.architecture }}"
          --work-dir "$RUNNER_TEMP/macos-toolchain-signed-clean"
          --artifacts-dir "$RUNNER_TEMP/macos-toolchain-signed-artifacts"
          --signing-identity "$DEVELOPER_ID_APPLICATION"
          --team-id "$APPLE_TEAM_ID"

  assemble-drafts:
    name: Assemble complete unpublished tool drafts
    needs: clean-quarantine
    environment: macos-toolchain-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact release commit without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.producer_commit }}
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Download the exact arm64 candidate set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-toolchain-signed-arm64
          path: ${{ runner.temp }}/macos-toolchain-signed-input/arm64

      - name: Download the exact x64 candidate set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-toolchain-signed-x64
          path: ${{ runner.temp }}/macos-toolchain-signed-input/x64

      - name: Verify architecture checksums and assemble exact release inventories
        run: |
          (cd "$RUNNER_TEMP/macos-toolchain-signed-input/arm64" && shasum -a 256 -c PROTECTED-SHA256SUMS)
          (cd "$RUNNER_TEMP/macos-toolchain-signed-input/x64" && shasum -a 256 -c PROTECTED-SHA256SUMS)
          bun toolchain:assemble-drafts \
            --artifacts-dir "$RUNNER_TEMP/macos-toolchain-signed-input" \
            --output-dir "$RUNNER_TEMP/macos-toolchain-drafts"

      - name: Refuse an existing public tag or release
        run: |
          for tag in toolchain-mupdf-1.27.2-r1 toolchain-qpdf-12.3.2-r1; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists; Phase 6 never overwrites a draft or release." >&2
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists; Phase 6 will not reuse it." >&2
              exit 1
            fi
          done

      - name: Create complete MuPDF and qpdf drafts without publishing
        run: |
          gh release create toolchain-mupdf-1.27.2-r1 "$RUNNER_TEMP/macos-toolchain-drafts/assets/mupdf/"* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "${{ inputs.producer_commit }}" \
            --title "MuPDF 1.27.2 macOS toolchain r1" \
            --notes-file "$RUNNER_TEMP/macos-toolchain-drafts/release-notes/mupdf.md"
          gh release create toolchain-qpdf-12.3.2-r1 "$RUNNER_TEMP/macos-toolchain-drafts/assets/qpdf/"* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "${{ inputs.producer_commit }}" \
            --title "qpdf 12.3.2 macOS toolchain r1" \
            --notes-file "$RUNNER_TEMP/macos-toolchain-drafts/release-notes/qpdf.md"

      - name: Verify both releases remain drafts with exact assets
        run: |
          for tool in mupdf qpdf; do
            if [ "$tool" = mupdf ]; then tag=toolchain-mupdf-1.27.2-r1; else tag=toolchain-qpdf-12.3.2-r1; fi
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,targetCommitish,assets > "$RUNNER_TEMP/$tool-draft.json"
            jq -e --arg tag "$tag" --arg commit "${{ inputs.producer_commit }}" '.isDraft == true and .tagName == $tag and .targetCommitish == $commit' "$RUNNER_TEMP/$tool-draft.json" >/dev/null
            jq -r '.assets[].name' "$RUNNER_TEMP/$tool-draft.json" | LC_ALL=C sort > "$RUNNER_TEMP/$tool-remote-assets"
            find "$RUNNER_TEMP/macos-toolchain-drafts/assets/$tool" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "$RUNNER_TEMP/$tool-local-assets"
            diff -u "$RUNNER_TEMP/$tool-local-assets" "$RUNNER_TEMP/$tool-remote-assets"
          done
          echo "Both immutable-release candidates are complete drafts; this workflow contains no publish step." >> "$GITHUB_STEP_SUMMARY"
