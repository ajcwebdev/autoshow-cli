name: macOS Toolchain Unsigned Verification

on:
  pull_request:
    paths:
      - '.github/workflows/macos-toolchain-unsigned.yml'
      - 'package.json'
      - 'bun.lock'
      - 'src/cli/commands/setup-and-utilities/setup/dependency-metadata.ts'
      - 'src/cli/commands/setup-and-utilities/setup/setup-download/managed-artifact.ts'
      - 'src/cli/commands/setup-and-utilities/setup/setup-download/mupdf-source-build.ts'
      - 'src/cli/commands/setup-and-utilities/setup/setup-download/prebuilt-artifact.ts'
      - 'src/cli/commands/setup-and-utilities/setup/setup-download/qpdf-source-build.ts'
      - 'src/cli/commands/setup-and-utilities/setup/setup-download/unsigned-prebuilt-artifact.ts'
      - 'src/tools/macos-toolchain-producer.ts'
      - 'src/types/setup-support/managed-artifact-types.ts'
      - 'test/fixtures/setup/managed-toolchain-smoke.pdf'
      - 'test/test-cases/validation/setup/prebuilt-producer-contracts.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-toolchain-unsigned-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned ${{ matrix.architecture }} candidates
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Check out the exact producer commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Build, test, and package unsigned verification candidates
        run: >-
          bun toolchain:produce-unsigned
          --architecture "${{ matrix.architecture }}"
          --work-dir "$RUNNER_TEMP/macos-toolchain-build"
          --output-dir "$RUNNER_TEMP/macos-toolchain-artifacts"

      - name: Upload non-promotable verification artifacts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-toolchain-unsigned-${{ matrix.architecture }}
          path: ${{ runner.temp }}/macos-toolchain-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Record run and immutable workflow-artifact digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "### Unsigned ${{ matrix.architecture }} producer evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- Non-promotable: true" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow artifact digest: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  clean-install:
    name: Clean-install unsigned ${{ matrix.architecture }} candidates
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Check out the exact consumer commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Download the exact matrix artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-toolchain-unsigned-${{ matrix.architecture }}
          path: ${{ runner.temp }}/macos-toolchain-artifacts

      - name: Verify recorded artifact digests
        working-directory: ${{ runner.temp }}/macos-toolchain-artifacts
        run: shasum -a 256 -c SHA256SUMS

      - name: Clean-install through the staged consumer
        run: >-
          bun toolchain:verify-unsigned
          --architecture "${{ matrix.architecture }}"
          --work-dir "$RUNNER_TEMP/macos-toolchain-clean-install"
          --artifacts-dir "$RUNNER_TEMP/macos-toolchain-artifacts"

      - name: Prove the independent source fallback
        run: >-
          bun toolchain:verify-source-fallback
          --architecture "${{ matrix.architecture }}"
          --work-dir "$RUNNER_TEMP/macos-toolchain-source-fallback"
