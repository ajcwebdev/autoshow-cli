name: Independent dependency graphs
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      fresh_build:
        description: Rebuild the audit images without any layer cache
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dependency-graphs-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.changes.outputs.image }}
      alignment: ${{ steps.changes.outputs.alignment }}
      javascript_graph: ${{ steps.changes.outputs.javascript_graph }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: changes
        uses: ./.github/actions/detect-changes
  javascript:
    needs: changes
    if: needs.changes.outputs.javascript_graph == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install rendering prerequisites while auditing frozen root and Defuddle graphs separately
        run: |
          (sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick pango1.0-tools fontconfig fonts-dejavu-core) > "${RUNNER_TEMP}/rendering-prerequisites-install.log" 2>&1 &
          apt_pid=$!
          mkdir -p runtime/dependency-evidence
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          bun --no-env-file audit > runtime/dependency-evidence/root-audit.txt
          bun --no-env-file pm licenses --json > runtime/dependency-evidence/root-licenses.json
          bun --no-env-file install --cwd config/defuddle --frozen-lockfile --ignore-scripts
          bun --no-env-file audit --cwd config/defuddle > runtime/dependency-evidence/defuddle-audit.txt
          bun --no-env-file pm --cwd config/defuddle licenses --json > runtime/dependency-evidence/defuddle-licenses.json
          apt_status=0; wait "${apt_pid}" || apt_status=$?
          test "${apt_status}" -eq 0 || cat "${RUNNER_TEMP}/rendering-prerequisites-install.log"
          test "${apt_status}" -eq 0
          bun --no-env-file test test/test-cases/validation/runtime-contracts/dependency-priority-contracts.test.ts test/test-cases/validation/setup/rendering-prerequisites-contracts.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: javascript-dependency-evidence
          path: runtime/dependency-evidence
  alignment:
    needs: changes
    if: needs.changes.outputs.alignment == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install and verify the frozen ONNX CPU graph
        run: |
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          bun --no-env-file install --cwd config/stt-alignment --frozen-lockfile --ignore-scripts
          bun --no-env-file test test/test-cases/validation/stt/workflows/timing/stt-onnx-alignment.test.ts
          mkdir -p runtime/dependency-evidence
          bun --no-env-file pm --cwd config/stt-alignment ls --all > runtime/dependency-evidence/alignment-inventory.txt
          bun --no-env-file audit --cwd config/stt-alignment > runtime/dependency-evidence/alignment-advisories.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alignment-${{ matrix.os }}
          path: runtime/dependency-evidence
  images:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [production, alignment]
        platform:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          name: autoshow-audit-builder
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Build this commit from the published layer cache or from scratch
        env:
          FRESH_BUILD: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fresh_build == true) }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          mkdir -p runtime/dependency-evidence
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [ "${FRESH_BUILD}" = true ]; then
            set -- --pull --no-cache
          else
            set -- --cache-from "type=registry,ref=${image}:buildcache-${ARCH}"
          fi
          docker buildx build --platform "linux/${ARCH}" --target "${TARGET}" --build-arg VCS_REF=${{ github.sha }} --load --tag autoshow-audit:${{ github.sha }} "$@" .
          printf '{"freshBuild":%s,"cacheSource":"%s"}\n' "${FRESH_BUILD}" "$([ "${FRESH_BUILD}" = true ] && printf none || printf '%s:buildcache-%s' "${image}" "${ARCH}")" > runtime/dependency-evidence/build-mode.json
          docker image inspect autoshow-audit:${{ github.sha }} > runtime/dependency-evidence/image-identity.json
          docker run --rm --network none --entrypoint sh autoshow-audit:${{ github.sha }} -c 'dpkg-query -W -f="\${Package}\t\${Version}\t\${Architecture}\n"' > runtime/dependency-evidence/debian-packages.tsv
          docker run --rm --network none --entrypoint tar autoshow-audit:${{ github.sha }} -czf - /usr/share/doc > runtime/dependency-evidence/native-notices.tar.gz
          docker run --rm --network none --entrypoint sh autoshow-audit:${{ github.sha }} -c 'ffmpeg -hide_banner -filters; convert -list format; fc-match "DejaVu Sans"' > runtime/dependency-evidence/rendering-capabilities.txt
          docker run --rm --network none --entrypoint bun autoshow-audit:${{ github.sha }} --no-env-file -e 'import {readDependencyMetadata} from "./src/cli/commands/setup-and-utilities/setup/dependency-metadata.ts"; console.log(JSON.stringify(await readDependencyMetadata(), null, 2))' > runtime/dependency-evidence/native-source-pins.json
          cp src/cli/commands/setup-and-utilities/setup/setup-download/managed-toolchain-distribution-policy.ts runtime/dependency-evidence/native-distribution-policy.ts
          cp src/cli/commands/stt/local/whisperfile/whisperfile-artifacts.ts runtime/dependency-evidence/model-artifact-pins.ts
      - name: Verify native image rendering offline
        run: |
          case "$(docker info --format '{{.Architecture}}')" in
            x86_64|amd64) daemon_arch=amd64; bun_arch=x64 ;;
            aarch64|arm64) daemon_arch=arm64; bun_arch=arm64 ;;
            *) echo 'Unsupported Docker daemon architecture' >&2; exit 1 ;;
          esac
          test "${daemon_arch}" = "${{ matrix.platform.arch }}"
          docker run --rm --network none --platform linux/${{ matrix.platform.arch }} --entrypoint bun --mount "type=bind,src=${GITHUB_WORKSPACE}/test/docker-acceptance/native-image-acceptance.ts,dst=/app/test/docker-acceptance/native-image-acceptance.ts,readonly" autoshow-audit:${{ github.sha }} --no-env-file /app/test/docker-acceptance/native-image-acceptance.ts "${bun_arch}"
      - name: Verify optional ONNX backend offline
        if: matrix.target == 'alignment'
        run: |
          docker run --rm --network none --entrypoint bun --mount "type=bind,src=${GITHUB_WORKSPACE}/test,dst=/app/test,readonly" autoshow-audit:${{ github.sha }} --no-env-file test test/test-cases/validation/stt/workflows/timing/stt-onnx-alignment.test.ts
          docker run --rm --network none --entrypoint bun autoshow-audit:${{ github.sha }} --no-env-file pm --cwd config/stt-alignment ls --all > runtime/dependency-evidence/alignment-inventory.txt
      - name: Inventory, audit, and gate this commit's image
        uses: ./.github/actions/scan-image
        with:
          image: autoshow-audit:${{ github.sha }}
          evidence-dir: runtime/dependency-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-image-${{ matrix.target }}-${{ matrix.platform.arch }}-${{ github.sha }}
          path: runtime/dependency-evidence
