name: Independent dependency graphs
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      fresh_build:
        description: Rebuild the audit images without any layer cache
        type: boolean
        default: false
permissions:
  contents: read
env:
  BUN_RUNTIME_TRANSPILER_CACHE_PATH: '0'
concurrency:
  group: dependency-graphs-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.changes.outputs.image }}
      alignment: ${{ steps.changes.outputs.alignment }}
      javascript_graph: ${{ steps.changes.outputs.javascript_graph }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/detect-changes
  image-targets:
    name: Select independently audited image targets
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      targets: ${{ steps.coverage.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Reuse completed same-commit native release audit coverage or retain both targets
        id: coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_CHANGED: ${{ needs.changes.outputs.image }}
        run: bun --no-env-file src/tools/docker-audit-coverage.ts
  javascript:
    needs: changes
    if: needs.changes.outputs.javascript_graph == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Provision managed rendering while auditing frozen root and Defuddle graphs separately
        run: |
          mkdir -p runtime/dependency-evidence
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          bun --no-env-file src/tools/project-runtime-dependencies.ts
          bun --no-env-file src/cli/create-cli.ts setup --step rendering > "${RUNNER_TEMP}/rendering-prerequisites-install.log" 2>&1 &
          rendering_pid=$!
          bun --no-env-file audit > runtime/dependency-evidence/root-audit.txt
          bun --no-env-file pm licenses --json > runtime/dependency-evidence/root-licenses.json
          bun --no-env-file src/cli/create-cli.ts setup --step defuddle
          bun --no-env-file audit --cwd runtime/defuddle > runtime/dependency-evidence/defuddle-audit.txt
          bun --no-env-file pm --cwd runtime/defuddle licenses --json > runtime/dependency-evidence/defuddle-licenses.json
          rendering_status=0; wait "${rendering_pid}" || rendering_status=$?
          test "${rendering_status}" -eq 0 || cat "${RUNNER_TEMP}/rendering-prerequisites-install.log"
          test "${rendering_status}" -eq 0
          bun --no-env-file test test/test-cases/validation/runtime-contracts/dependency-priority-contracts.test.ts test/test-cases/validation/setup/rendering-prerequisites-contracts.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: javascript-dependency-evidence
          path: runtime/dependency-evidence
  alignment:
    needs: changes
    if: needs.changes.outputs.alignment == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install and verify the frozen ONNX CPU graph
        run: |
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          bun --no-env-file src/tools/project-runtime-dependencies.ts
          bun --no-env-file src/cli/create-cli.ts setup --step alignment
          bun --no-env-file test test/test-cases/validation/stt/workflows/timing/stt-onnx-alignment.test.ts
          mkdir -p runtime/dependency-evidence
          bun --no-env-file pm --cwd runtime/tools/stt-alignment ls --all > runtime/dependency-evidence/alignment-inventory.txt
          bun --no-env-file audit --cwd runtime/tools/stt-alignment > runtime/dependency-evidence/alignment-advisories.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: alignment-${{ matrix.os }}
          path: runtime/dependency-evidence
  images:
    needs: [changes, image-targets]
    if: ${{ !cancelled() && needs.changes.outputs.image == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.image-targets.outputs.targets || '["production","alignment"]') }}
        platform:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Create Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          name: autoshow-audit-builder
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Build this commit from the published layer cache or from scratch
        env:
          FRESH_BUILD: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fresh_build == true) }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          mkdir -p runtime/dependency-evidence
          image="$(bash src/tools/docker-image-name.sh)"
          if [ "${FRESH_BUILD}" = true ]; then
            set -- --pull --no-cache
          else
            set -- --cache-from "type=registry,ref=${image}:buildcache-${ARCH}"
          fi
          docker buildx build --platform "linux/${ARCH}" --target "${TARGET}" --build-arg VCS_REF=${{ github.sha }} --load --tag autoshow-audit:${{ github.sha }} "$@" .
          printf '{"freshBuild":%s,"cacheSource":"%s"}\n' "${FRESH_BUILD}" "$([ "${FRESH_BUILD}" = true ] && printf none || printf '%s:buildcache-%s' "${image}" "${ARCH}")" > runtime/dependency-evidence/build-mode.json
          IMAGE_REFERENCE="autoshow-audit:${GITHUB_SHA}" EVIDENCE_DIR=runtime/dependency-evidence bash src/tools/docker-capture-native-evidence.sh
      - name: Install frozen production graph for the acceptance host
        run: bun --no-env-file install --frozen-lockfile --production --omit=peer
      - name: Verify Tesseract packaged and managed data offline
        run: bun --no-env-file test/docker-acceptance/docker-tesseract-data-acceptance.ts --image "autoshow-audit:${{ github.sha }}" --output runtime/dependency-evidence/tesseract
      - name: Verify persistent state and restricted runtime offline
        run: bun --no-env-file test/docker-acceptance/docker-runtime-state-acceptance.ts --image "autoshow-audit:${{ github.sha }}" --output runtime/dependency-evidence/runtime-state
      - name: Verify native image rendering offline
        run: |
          case "$(docker info --format '{{.Architecture}}')" in
            x86_64|amd64) daemon_arch=amd64; bun_arch=x64 ;;
            aarch64|arm64) daemon_arch=arm64; bun_arch=arm64 ;;
            *) echo 'Unsupported Docker daemon architecture' >&2; exit 1 ;;
          esac
          test "${daemon_arch}" = "${{ matrix.platform.arch }}"
          docker run --rm --network none --platform linux/${{ matrix.platform.arch }} --entrypoint bun autoshow-audit:${{ github.sha }} --no-env-file src/tools/docker-installed-dependencies.ts
          docker run --rm --network none --platform linux/${{ matrix.platform.arch }} --entrypoint bun --mount "type=bind,src=${GITHUB_WORKSPACE}/test/docker-acceptance/native-image-acceptance.ts,dst=/app/test/docker-acceptance/native-image-acceptance.ts,readonly" autoshow-audit:${{ github.sha }} --no-env-file /app/test/docker-acceptance/native-image-acceptance.ts "${bun_arch}"
      - name: Verify optional ONNX backend offline
        if: matrix.target == 'alignment'
        run: |
          docker run --rm --network none --entrypoint bun autoshow-audit:${{ github.sha }} --no-env-file src/tools/docker-first-use.ts
          # First-use above must see the original HOME; state checks use fresh writable mounts.
          for state_user in default host; do
            state_dir="$(mktemp -d "${RUNNER_TEMP}/alignment-state-XXXXXX")"
            mkdir -p "${state_dir}/runtime" "${state_dir}/home" "${state_dir}/input" "${state_dir}/output"
            if [ "${state_user}" = default ]; then
              sudo chown -R 1000:1000 "${state_dir}"
              set --
            else
              set -- --user "$(id -u):$(id -g)"
            fi
            docker run --rm --network none "$@" --entrypoint bun \
              --mount "type=bind,src=${state_dir}/runtime,dst=/app/runtime" \
              --mount "type=bind,src=${state_dir}/home,dst=/home/bun" \
              --mount "type=bind,src=${state_dir}/input,dst=/app/input" \
              --mount "type=bind,src=${state_dir}/output,dst=/app/output" \
              autoshow-audit:${{ github.sha }} --no-env-file src/tools/docker-installed-dependencies.ts --state \
              > "runtime/dependency-evidence/alignment-state-${state_user}.json"
          done
          docker run --rm --network none --entrypoint bun --mount "type=bind,src=${GITHUB_WORKSPACE}/test,dst=/app/test,readonly" autoshow-audit:${{ github.sha }} --no-env-file test test/test-cases/validation/stt/workflows/timing/stt-onnx-alignment.test.ts
          # Bun pm opens the frozen manifest for writing; only inventory needs root over the immutable graph.
          docker run --rm --network none --user 0 --entrypoint bun autoshow-audit:${{ github.sha }} --no-env-file pm --cwd runtime/tools/stt-alignment ls --all > runtime/dependency-evidence/alignment-inventory.txt
      - name: Inventory, audit, and gate this commit's image
        uses: ./.github/actions/scan-image
        with:
          image: autoshow-audit:${{ github.sha }}
          evidence-dir: runtime/dependency-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: current-image-${{ matrix.target }}-${{ matrix.platform.arch }}-${{ github.sha }}
          path: runtime/dependency-evidence
