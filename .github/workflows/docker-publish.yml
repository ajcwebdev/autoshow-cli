name: Verify and Publish Docker Image
"on":
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
env:
  BUN_RUNTIME_TRANSPILER_CACHE_PATH: '0'
concurrency:
  group: "autoshow-ghcr-${{ github.event_name == 'push' && 'latest' || github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: "${{ steps.changes.outputs.image }}"
      code: "${{ steps.changes.outputs.code }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Detect changed areas
        id: changes
        uses: ./.github/actions/detect-changes
  managed-macos:
    name: Managed macOS ARM64 setup and free e2e
    needs: changes
    if: "needs.changes.outputs.code == 'true'"
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Install supported bootstrap Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install the frozen application graph
        run: |
          bun --no-env-file install --frozen-lockfile --ignore-scripts
          bun --no-env-file src/tools/project-runtime-dependencies.ts
      - name: Preview a cold setup without runtime mutation
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          bootstrap_bun="$(command -v bun)"
          test ! -e runtime/tools/native
          "${bootstrap_bun}" --no-env-file test/setup-acceptance/managed-runtime-snapshot.ts runtime > "${RUNNER_TEMP}/managed-runtime-before-plan.json"
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="${HOME}" BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 CI=true AUTOSHOW_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
            "${bootstrap_bun}" --no-env-file src/cli/create-cli.ts setup --dry-run --json > "${RUNNER_TEMP}/managed-setup-plan.json"
          "${bootstrap_bun}" --no-env-file test/setup-acceptance/managed-runtime-snapshot.ts runtime > "${RUNNER_TEMP}/managed-runtime-after-plan.json"
          cmp "${RUNNER_TEMP}/managed-runtime-before-plan.json" "${RUNNER_TEMP}/managed-runtime-after-plan.json"
      - name: Provision, reuse, and diagnose the managed native graph
        run: |
          set -euo pipefail
          bootstrap_bun="$(command -v bun)"
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="${HOME}" BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 CI=true AUTOSHOW_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
            "${bootstrap_bun}" --no-env-file src/cli/create-cli.ts setup
          mkdir -p runtime/ci/managed-macos
          test -x /usr/bin/sandbox-exec
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="${HOME}" BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 CI=true AUTOSHOW_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
            "${bootstrap_bun}" --no-env-file test/setup-acceptance/managed-offline-setup.ts > runtime/ci/managed-macos/warm-setup.json
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="${HOME}" BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 CI=true AUTOSHOW_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
            "${bootstrap_bun}" --no-env-file src/cli/create-cli.ts setup --doctor --strict --json > runtime/ci/managed-macos/doctor.json
      - name: Run the curated free e2e selection without provider credentials
        run: |
          set -euo pipefail
          bootstrap_bun="$(command -v bun)"
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="${HOME}" BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 CI=true AUTOSHOW_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
            "${bootstrap_bun}" --no-env-file --no-orphans test/test-runner.ts \
              test/test-cases/e2e/local \
              test/test-cases/e2e/service/audio/music/provider-flag-validation.test.ts \
              test/test-cases/e2e/service/audio/tts/removed-mistral.test.ts \
              test/test-cases/e2e/service/audio/tts/inworld-realtime-tts-2.test.ts \
              test/test-cases/e2e/service/visuals/image/image-usage-errors.test.ts \
              test/test-cases/e2e/service/visuals/video/video-usage-errors.test.ts \
              --no-cleanup --parallel=4 --max-concurrency=2
      - name: Retain native setup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-macos-arm64-${{ github.sha }}
          path: |
            runtime/ci/managed-macos
            runtime/setup-performance
            output/test-output/latest.log
  verify:
    name: No-cost verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Detect changed areas
        id: changes
        uses: ./.github/actions/detect-changes
      - name: Install supported Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify Bun pin
        run: "test \"$(bun --version)\" = \"1.4.2\""
      - name: Install frozen dependencies
        run: bun --no-env-file install --frozen-lockfile
      - name: Provision managed local dependencies and run repository checks
        run: |
          set -uo pipefail
          (bun --no-env-file src/cli/create-cli.ts setup --step rendering && bun --no-env-file src/cli/create-cli.ts setup --step calibre) > "${RUNNER_TEMP}/native-tools-install.log" 2>&1 &
          native_pid=$!
          bun --no-env-file run check > "${RUNNER_TEMP}/repository-check.log" 2>&1 &
          check_pid=$!
          native_status=0; wait "${native_pid}" || native_status=$?
          test "${native_status}" -eq 0 || cat "${RUNNER_TEMP}/native-tools-install.log"
          price_status=0
          test "${native_status}" -eq 0 && { bun --no-env-file t --price --no-cleanup || price_status=$?; }
          timings_status=0
          bun --no-env-file src/tools/ci-run-timings.ts price "$(ls -t1 output/test-output/*/metrics.ndjson | head -1)" || timings_status=$?
          check_status=0; wait "${check_pid}" || check_status=$?
          cat "${RUNNER_TEMP}/repository-check.log"
          echo "check=${check_status} native-tools=${native_status} price=${price_status} timings=${timings_status}"
          test "${check_status}" -eq 0 && test "${native_status}" -eq 0 && test "${price_status}" -eq 0 && test "${timings_status}" -eq 0
      - name: "Run local CLI, Docker, DOCX, and Bun migration contracts"
        if: "steps.changes.outputs.code == 'true'"
        run: |
          set -uo pipefail
          (
            set -e
            bun --no-env-file test test/test-cases/validation/cli/cli-help-contracts.test.ts
            bun --no-env-file test test/test-cases/validation/cli/cli-usage-errors/
            bun --no-env-file test test/test-cases/validation/cli/option-resolution-contracts/
          ) > "${RUNNER_TEMP}/cli-smoke-contracts.log" 2>&1 &
          cli_pid=$!
          bun --no-env-file test \
            test/test-cases/validation/docker-acceptance/ \
            test/test-cases/validation/text/ocr/docx-markdown.test.ts \
            test/test-cases/validation/text/ocr/docx-command-contracts.test.ts \
            test/test-cases/validation/cli/network-check-contracts.test.ts \
            test/test-cases/validation/cli/required-image-model-contracts.test.ts \
            test/test-cases/validation/cli/docker-workspace-invocation.test.ts \
            test/test-cases/validation/providers/provider-rest-client-contracts.test.ts \
            test/test-cases/validation/providers/openai-rest-contracts/ > "${RUNNER_TEMP}/docker-docx-contracts.log" 2>&1 &
          docker_pid=$!
          migration_status=0
          bun --no-env-file test \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/console-harness.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/artifacts-parsing.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/file-timings.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/process-price-orchestration.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/runner-preservation.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/args-selection.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/budget-preflight.test.ts \
            test/test-cases/validation/runtime-contracts/retry-abort-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/bun-native-migration-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/dependency-hygiene-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/profiling-recipes-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/reference-tokenizer-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/bounded-text-stream-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/process-tree-cleanup-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/jsonl-reader-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/bun-xml-adapter-contracts.test.ts \
            test/test-cases/validation/cli/json-output-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/logging-contracts/text-json-logging-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/output-vocabulary-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/app-error-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/retry-policy-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/retry-create-admission-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/retry-metadata-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/retry-vocabulary-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/hosted-concurrency-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/multipart-serialization-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/fetch-error-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/bun-version-alignment-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/maintenance-environment-contracts.test.ts \
            test/test-cases/validation/audio/tts/inworld-tts-websocket-adapter.test.ts \
            test/test-cases/validation/visuals/comic/comic-audio-execution-publication-contracts.test.ts \
            test/test-cases/validation/visuals/comic/comic-image-composition-contracts.test.ts \
            test/test-cases/validation/stt/async-stt-lifecycle-adoption-contracts.test.ts \
            test/test-cases/validation/audio/tts/tts-compact-archive-contracts.test.ts \
            test/test-cases/validation/text/ocr/ocr-bun-image-normalization-contracts.test.ts \
            test/test-cases/validation/text/write/song-explainer-contracts.test.ts \
            test/test-cases/validation/text/write/research-prompts-contracts.test.ts \
            test/test-cases/validation/text/write/structured-output-failure-contracts.test.ts \
            test/test-cases/validation/configuration/prompt-loader-contracts.test.ts \
            test/test-cases/validation/setup/tar-gz-security-contracts.test.ts \
            test/test-cases/validation/setup/setup-doctor-contracts.test.ts \
            test/test-cases/validation/cli/docker-image-contracts.test.ts \
            test/test-cases/validation/cli/docker-runtime-recipe.test.ts \
            test/test-cases/validation/cli/docker-installed-dependencies.test.ts \
            test/test-cases/validation/cli/docker-application-permissions.test.ts \
            test/test-cases/validation/cli/docker-scanner-install.test.ts \
            test/test-cases/validation/cli/docker-native-evidence.test.ts \
            test/test-cases/validation/cli/docker-audit-coverage.test.ts \
            test/test-cases/validation/runtime-contracts/tesseract-data-selection.test.ts \
            test/test-cases/validation/cli/docker-release-index.test.ts \
            test/test-cases/validation/cli/docker-release-shell.test.ts \
            test/test-cases/validation/runtime-contracts/ci-run-timings-contracts.test.ts || migration_status=$?
          cli_status=0; wait "${cli_pid}" || cli_status=$?
          cat "${RUNNER_TEMP}/cli-smoke-contracts.log"
          docker_status=0; wait "${docker_pid}" || docker_status=$?
          cat "${RUNNER_TEMP}/docker-docx-contracts.log"
          echo "cli-smoke=${cli_status} docker-docx=${docker_status} migration=${migration_status}"
          test "${cli_status}" -eq 0 && test "${docker_status}" -eq 0 && test "${migration_status}" -eq 0
      - name: Verify authored Docker build context
        if: "steps.changes.outputs.image == 'true'"
        run: bun --no-env-file test/docker-acceptance/docker-context-acceptance.ts
  package-hygiene:
    name: Package hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Install supported Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install frozen dependencies
        run: |
          mkdir -p "${RUNNER_TEMP}/bun-package-home"
          env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun install --frozen-lockfile
      - name: Audit dependencies
        run: "env -i PATH=\"${PATH}\" HOME=\"${RUNNER_TEMP}/bun-package-home\" CI=true bun audit"
      - name: Check dependency deduplication
        run: "env -i PATH=\"${PATH}\" HOME=\"${RUNNER_TEMP}/bun-package-home\" CI=true bun dedupe --check"
      - name: Cross-check types with the reference compiler
        run: bun --no-env-file run check:types:tsc
      - name: Record non-mutating dependency cleanup reviews
        run: |
          mkdir -p runtime/ci
          env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun audit fix --dry-run > runtime/ci/audit-fix-dry-run.txt
          env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun prune --dry-run > runtime/ci/prune-dry-run.txt
      - name: Record production licenses
        run: |
          mkdir -p runtime/ci
          env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun pm licenses --prod --json > runtime/ci/production-licenses.json
      - name: Upload production license report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-license-report
          path: runtime/ci/production-licenses.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload dependency cleanup review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-cleanup-review
          path: |
            runtime/ci/audit-fix-dry-run.txt
            runtime/ci/prune-dry-run.txt
          if-no-files-found: error
          retention-days: 14
  build-amd64:
    name: Build AMD64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: "github.event_name == 'push' && needs.changes.outputs.image == 'true'"
    needs:
      - changes
    permissions:
      contents: read
      packages: write
    outputs:
      digest: "${{ steps.build.outputs.digest }}"
      build_duration_ms: "${{ steps.build.outputs.build_duration_ms }}"
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          username: "${{ github.actor }}"
      - name: Build native production image
        id: build
        uses: ./.github/actions/build-native-image
        with:
          arch: amd64
  smoke-amd64:
    name: Smoke and measure AMD64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - build-amd64
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          username: "${{ github.actor }}"
      - name: Smoke native production image offline
        uses: ./.github/actions/smoke-native-image
        with:
          arch: amd64
          digest: "${{ needs.build-amd64.outputs.digest }}"
          build-duration-ms: "${{ needs.build-amd64.outputs.build_duration_ms }}"
      - name: Upload AMD64 smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-smoke-amd64
          path: |
            runtime/ci/docker-amd64
            docs/reports/release-evidence/amd64
          if-no-files-found: error
          retention-days: 14
  audit-amd64:
    name: Audit AMD64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - build-amd64
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          username: "${{ github.actor }}"
      - name: Audit exact native production image
        uses: ./.github/actions/audit-native-image
        with:
          arch: amd64
          digest: "${{ needs.build-amd64.outputs.digest }}"
      - name: Upload AMD64 audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-audit-amd64
          path: |
            runtime/ci/docker-amd64
            docs/reports/release-evidence/amd64
          if-no-files-found: error
          retention-days: 14
  build-arm64:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    if: "github.event_name == 'push' && needs.changes.outputs.image == 'true'"
    needs:
      - changes
    permissions:
      contents: read
      packages: write
    outputs:
      digest: "${{ steps.build.outputs.digest }}"
      build_duration_ms: "${{ steps.build.outputs.build_duration_ms }}"
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          username: "${{ github.actor }}"
      - name: Build native production image
        id: build
        uses: ./.github/actions/build-native-image
        with:
          arch: arm64
  smoke-arm64:
    name: Smoke and measure ARM64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs:
      - build-arm64
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          username: "${{ github.actor }}"
      - name: Smoke native production image offline
        uses: ./.github/actions/smoke-native-image
        with:
          arch: arm64
          digest: "${{ needs.build-arm64.outputs.digest }}"
          build-duration-ms: "${{ needs.build-arm64.outputs.build_duration_ms }}"
      - name: Upload ARM64 smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-smoke-arm64
          path: |
            runtime/ci/docker-arm64
            docs/reports/release-evidence/arm64
          if-no-files-found: error
          retention-days: 14
  audit-arm64:
    name: Audit ARM64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs:
      - build-arm64
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          username: "${{ github.actor }}"
      - name: Audit exact native production image
        uses: ./.github/actions/audit-native-image
        with:
          arch: arm64
          digest: "${{ needs.build-arm64.outputs.digest }}"
      - name: Upload ARM64 audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-audit-arm64
          path: |
            runtime/ci/docker-arm64
            docs/reports/release-evidence/arm64
          if-no-files-found: error
          retention-days: 14
  publish-manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    needs:
      - verify
      - managed-macos
      - package-hygiene
      - build-amd64
      - build-arm64
      - smoke-amd64
      - smoke-arm64
      - audit-amd64
      - audit-arm64
    outputs:
      digest: "${{ steps.publish.outputs.digest }}"
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Install supported Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Create Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          username: "${{ github.actor }}"
      - name: Create and verify SHA-tagged candidate index
        id: publish
        env:
          AMD64_DIGEST: "${{ needs.build-amd64.outputs.digest }}"
          ARM64_DIGEST: "${{ needs.build-arm64.outputs.digest }}"
        run: |
          set -euo pipefail
          image="$(bash src/tools/docker-image-name.sh)"
          bun --no-env-file src/tools/docker-release-index.ts candidate "${image}" "${GITHUB_SHA}" "${AMD64_DIGEST}" "${ARM64_DIGEST}"
  acceptance:
    name: "GHCR acceptance (${{ matrix.arch }}, ${{ matrix.shard }})"
    needs: publish-manifest
    runs-on: "${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}"
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        shard:
          - core
          - network
          - whisperfile:tiny
          - whisperfile:tiny.en
          - whisperfile:small
          - whisperfile:small.en
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Install supported Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install frozen dependencies
        run: bun --no-env-file install --frozen-lockfile --production --omit=peer
      - name: Restore local assets
        id: assets
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: runtime/docker-acceptance/cache
          key: "docker-local-v1-${{ matrix.arch }}-${{ matrix.shard }}-${{ hashFiles('Dockerfile', 'src/cli/commands/setup-and-utilities/**', 'src/cli/commands/stt/local/**', 'src/cli/commands/text/url/url-local/**') }}"
          restore-keys: "docker-local-v1-${{ matrix.arch }}-${{ matrix.shard }}-"
      - name: Accept immutable candidate through its CLI
        env:
          SHARD: "${{ matrix.shard }}"
          PLATFORM: "linux/${{ matrix.arch }}"
          EXPECTED_DIGEST: "${{ needs.publish-manifest.outputs.digest }}"
        run: |
          set -euo pipefail
          if [ "${SHARD}" = core ] || [ "${SHARD}" = network ]; then
            set -- --suite "${SHARD}"
          else
            set -- --suite models --model "${SHARD}"
          fi
          image="$(bash src/tools/docker-image-name.sh)"
          bun t:docker "$@" --platform "${PLATFORM}" --user "$(id -u):$(id -g)" \
            --image "${image}@${EXPECTED_DIGEST}" --pull always \
            --expected-digest "${EXPECTED_DIGEST}" --expected-revision "${GITHUB_SHA}" \
            --output runtime/docker-acceptance/evidence
      - name: Retain local assets even after failure
        if: "always() && steps.assets.outputs.cache-hit != 'true'"
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: runtime/docker-acceptance/cache
          key: "${{ steps.assets.outputs.cache-primary-key }}"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "ghcr-acceptance-${{ matrix.arch }}-${{ strategy.job-index }}"
          path: runtime/docker-acceptance/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  acceptance-required:
    name: Published latest acceptance
    if: "always() && github.event_name == 'push' && needs.changes.outputs.image == 'true'"
    needs:
      - changes
      - publish-manifest
      - acceptance
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native shard
        env:
          PUBLICATION: "${{ needs.publish-manifest.result }}"
          ACCEPTANCE: "${{ needs.acceptance.result }}"
        run: |
          if [ "${PUBLICATION}" != success ] || [ "${ACCEPTANCE}" != success ]; then
            printf 'Candidate: %s; acceptance: %s. Promotion blocked; latest remains unchanged.\n' "${PUBLICATION}" "${ACCEPTANCE}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          printf '%s\n' 'All core, model, and public-network cases passed on native AMD64 and ARM64.' >> "${GITHUB_STEP_SUMMARY}"
  promote-latest:
    name: Promote accepted index to latest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: "github.event_name == 'push' && needs.changes.outputs.image == 'true'"
    needs:
      - changes
      - publish-manifest
      - acceptance-required
      - build-amd64
      - build-arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 1
          persist-credentials: false
      - name: Install supported Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Create Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: Log in to GitHub Container Registry
        uses: ./.github/actions/ghcr-login
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          username: "${{ github.actor }}"
      - name: Copy accepted index and verify latest digest
        env:
          AMD64_DIGEST: "${{ needs.build-amd64.outputs.digest }}"
          ARM64_DIGEST: "${{ needs.build-arm64.outputs.digest }}"
          ACCEPTED_DIGEST: "${{ needs.publish-manifest.outputs.digest }}"
        run: |
          set -euo pipefail
          image="$(bash src/tools/docker-image-name.sh)"
          bun --no-env-file src/tools/docker-release-index.ts promote "${image}" "${ACCEPTED_DIGEST}" "${AMD64_DIGEST}" "${ARM64_DIGEST}"
