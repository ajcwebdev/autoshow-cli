name: Verify and Publish Docker Image

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Hold this lock through post-publication acceptance, not only manifest creation.
concurrency:
  group: autoshow-ghcr-${{ github.event_name == 'push' && 'latest' || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: No-cost verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install supported Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Verify Bun pin
        run: test "$(bun --version)" = "1.4.2"

      - name: Install frozen dependencies
        run: bun --no-env-file install --frozen-lockfile

      - name: Install local image composition dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes imagemagick

      - name: Run repository checks
        run: |
          bun --no-env-file run check
          bun --no-env-file t --price

      - name: Run local CLI smoke contracts
        run: |
          bun --no-env-file test test/test-cases/validation/cli/cli-help-contracts.test.ts
          bun --no-env-file test test/test-cases/validation/cli/cli-usage-errors/
          bun --no-env-file test test/test-cases/validation/cli/option-resolution-contracts/

      - name: Run Docker and DOCX contracts
        run: |
          bun --no-env-file test \
            test/test-cases/validation/docker-acceptance/ \
            test/test-cases/validation/text/ocr/docx-markdown.test.ts \
            test/test-cases/validation/text/ocr/docx-command-contracts.test.ts \
            test/test-cases/validation/cli/network-check-contracts.test.ts \
            test/test-cases/validation/cli/required-image-model-contracts.test.ts \
            test/test-cases/validation/cli/docker-workspace-invocation.test.ts \
            test/test-cases/validation/providers/provider-rest-client-contracts.test.ts \
            test/test-cases/validation/providers/openai-rest-contracts/

      - name: Run Bun migration contracts
        run: |
          bun --no-env-file test \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/console-harness.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/artifacts-parsing.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/file-timings.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/process-price-orchestration.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/args-selection.test.ts \
            test/test-cases/validation/runtime-contracts/test-runner-contracts/budget-preflight.test.ts \
            test/test-cases/validation/runtime-contracts/retry-abort-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/bun-native-migration-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/dependency-hygiene-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/profiling-recipes-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/reference-tokenizer-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/bounded-text-stream-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/process-tree-cleanup-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/jsonl-reader-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/bun-xml-adapter-contracts.test.ts \
            test/test-cases/validation/cli/json-output-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/logging-contracts/text-json-logging-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/output-vocabulary-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/app-error-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/retry-policy-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/retry-create-admission-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/retry-metadata-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/retry-vocabulary-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/hosted-concurrency-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/multipart-serialization-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/fetch-error-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/bun-version-alignment-contracts.test.ts \
            test/test-cases/validation/runtime-contracts/maintenance-environment-contracts.test.ts \
            test/test-cases/validation/audio/tts/inworld-tts-websocket-adapter.test.ts \
            test/test-cases/validation/visuals/comic/comic-audio-execution-publication-contracts.test.ts \
            test/test-cases/validation/visuals/comic/comic-image-composition-contracts.test.ts \
            test/test-cases/validation/stt/async-stt-lifecycle-adoption-contracts.test.ts \
            test/test-cases/validation/audio/tts/tts-compact-archive-contracts.test.ts \
            test/test-cases/validation/text/ocr/ocr-bun-image-normalization-contracts.test.ts \
            test/test-cases/validation/setup/tar-gz-security-contracts.test.ts \
            test/test-cases/validation/setup/setup-doctor-contracts.test.ts \
            test/test-cases/validation/cli/docker-image-contracts.test.ts

  package-hygiene:
    name: Package hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install supported Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install frozen dependencies
        run: |
          mkdir -p "${RUNNER_TEMP}/bun-package-home"
          env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun install --frozen-lockfile

      - name: Audit dependencies
        run: env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun audit

      - name: Check dependency deduplication
        run: env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun dedupe --check

      - name: Record non-mutating dependency cleanup reviews
        run: |
          mkdir -p runtime/ci
          env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun audit fix --dry-run > runtime/ci/audit-fix-dry-run.txt
          env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun prune --dry-run > runtime/ci/prune-dry-run.txt

      - name: Record production licenses
        run: |
          mkdir -p runtime/ci
          env -i PATH="${PATH}" HOME="${RUNNER_TEMP}/bun-package-home" CI=true bun pm licenses --prod --json > runtime/ci/production-licenses.json

      - name: Upload production license report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-license-report
          path: runtime/ci/production-licenses.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload dependency cleanup review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-cleanup-review
          path: |
            runtime/ci/audit-fix-dry-run.txt
            runtime/ci/prune-dry-run.txt
          if-no-files-found: error
          retention-days: 14

  build-amd64:
    name: Build AMD64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'push'
    needs:
      - verify
      - package-hygiene
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Fetch repository at the pushed commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          umask 077
          credential_helper="$(mktemp)"
          trap 'rm -f "$credential_helper"' EXIT
          cat > "$credential_helper" <<'HELPER'
          #!/bin/sh
          if [ "$1" = get ]; then
            printf 'username=x-access-token\npassword=%s\n' "$GITHUB_TOKEN"
          fi
          HELPER
          chmod 700 "$credential_helper"
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c "credential.helper=$credential_helper" fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Create Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          name: autoshow-builder
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push AMD64 image by digest
        id: build
        run: |
          set -euo pipefail
          started_ns="$(date +%s%N)"
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          created="$(git show -s --format=%cI "${GITHUB_SHA}")"
          version="$(jq -er '.version' package.json)"
          metadata_file="$(mktemp)"
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --build-arg "AUTOSHOW_VERSION=${version}" \
            --build-arg "BUILD_DATE=${created}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${created}" \
            --provenance=mode=max \
            --sbom=true \
            --cache-from "type=registry,ref=${image}:buildcache-amd64" \
            --cache-from "type=registry,ref=${image}:buildcache" \
            --cache-to "type=registry,ref=${image}:buildcache-amd64,mode=max" \
            --output "type=image,name=${image},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${metadata_file}" \
            .
          digest="$(jq -er '."containerimage.digest"' "${metadata_file}")"
          case "${digest}" in
            sha256:*) ;;
            *) printf 'Unexpected AMD64 image digest: %s\n' "${digest}" >&2; exit 1 ;;
          esac
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'build_duration_ms=%s\n' "$(( ($(date +%s%N) - started_ns) / 1000000 ))" >> "${GITHUB_OUTPUT}"

      - name: Smoke and measure AMD64 image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_DURATION_MS: ${{ steps.build.outputs.build_duration_ms }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_ref="${image}@${IMAGE_DIGEST}"
          report_dir="runtime/ci/docker-amd64"
          mkdir -p "${report_dir}"
          docker pull --platform linux/amd64 "${image_ref}" >/dev/null
          # Materialize lazy image layers before reading their sizes.
          test "$(docker run --rm --platform linux/amd64 --network none --entrypoint bun "${image_ref}" --version)" = "1.4.2"
          test "$(uname -m)" = "x86_64"
          test "$(docker info --format '{{.Architecture}}')" = "x86_64"
          mkdir -p docs/reports/release-evidence/amd64
          docker run --rm --platform linux/amd64 --network none --entrypoint bun --mount "type=bind,src=${GITHUB_WORKSPACE}/test/docker-acceptance/native-image-acceptance.ts,dst=/app/test/docker-acceptance/native-image-acceptance.ts,readonly" "${image_ref}" --no-env-file /app/test/docker-acceptance/native-image-acceptance.ts x64 > docs/reports/release-evidence/amd64/rendering.log 2>&1
          jq -n --arg digest "${IMAGE_DIGEST}" --arg architecture amd64 '{digest:$digest,architecture:$architecture,native:true,network:"none",status:"passed"}' > docs/reports/release-evidence/amd64/native-acceptance.json
          docker history --no-trunc --human=false --format '{{json .}}' "${image_ref}" > "${report_dir}/image-history.jsonl"
          docker run --rm --platform linux/amd64 --entrypoint bun "${image_ref}" --no-env-file install --frozen-lockfile --production > "${report_dir}/production-install.log" 2>&1
          docker run --rm --platform linux/amd64 "${image_ref}" --help > "${report_dir}/help.log" 2>&1
          docker run --rm --platform linux/amd64 "${image_ref}" config --show --config-path /tmp/autoshow-smoke-config.json --no-color > "${report_dir}/config.log" 2>&1
          docker run --rm --platform linux/amd64 "${image_ref}" setup --doctor --no-color > "${report_dir}/doctor.log" 2>&1
          grep -F 'Setup doctor:' "${report_dir}/doctor.log"
          grep -F 'Setup doctor completed' "${report_dir}/doctor.log"
          help_samples="$({ for _ in 1 2 3 4 5; do start="$(date +%s%N)"; docker run --rm --platform linux/amd64 "${image_ref}" --help >/dev/null; printf '%s\n' "$(( ($(date +%s%N) - start) / 1000000 ))"; done; } | jq -s '.')"
          prebuild_samples="$({ for _ in 1 2 3 4 5; do docker run --rm --platform linux/amd64 --entrypoint bun "${image_ref}" --no-env-file -e 'const start=performance.now();const p=Bun.spawn(["bun","--no-env-file","build","/app/src/cli/create-cli.ts","--target=bun","--outfile","/tmp/autoshow-cli-ci.js"],{stdout:"ignore",stderr:"pipe"});const stderr=await new Response(p.stderr).text();const code=await p.exited;if(code!==0)throw new Error(stderr);console.log(performance.now()-start)'; done; } | jq -s '.')"
          fixture="${GITHUB_WORKSPACE}/test/fixtures/setup/managed-toolchain-smoke.pdf"
          fixture_sha256="$(sha256sum "${fixture}" | cut -d ' ' -f 1)"
          fixture_peak_samples="$({ for index in 1 2 3; do fixture_output="${RUNNER_TEMP}/autoshow-rss-amd64-${index}"; mkdir -p "${fixture_output}"; chmod 0777 "${fixture_output}"; docker run --rm --platform linux/amd64 --env NO_COLOR=1 --entrypoint /bin/sh --mount "type=bind,src=${fixture},dst=/benchmark/fixture.pdf,readonly" --mount "type=bind,src=${fixture_output},dst=/benchmark/output" "${image_ref}" -c 'set -eu; bun --no-env-file /app/src/cli/create-cli.ts extract /benchmark/fixture.pdf --provider tesseract --ocr-concurrency 1 --output-root /benchmark/output >/dev/null 2>&1; cat /sys/fs/cgroup/memory.peak'; done; } | jq -s '.')"
          compiled_ref="autoshow-compiled-experiment:${GITHUB_SHA}-amd64"
          compiled_started_ns="$(date +%s%N)"
          docker buildx build --platform linux/amd64 --target compiled-experiment --load --tag "${compiled_ref}" .
          compiled_build_duration_ms="$(( ($(date +%s%N) - compiled_started_ns) / 1000000 ))"
          docker run --rm --platform linux/amd64 "${compiled_ref}" --help > "${report_dir}/compiled-help.log" 2>&1
          docker run --rm --platform linux/amd64 "${compiled_ref}" config --show --config-path /tmp/autoshow-compiled-config.json --no-color > "${report_dir}/compiled-config.log" 2>&1
          docker run --rm --platform linux/amd64 "${compiled_ref}" setup --doctor --no-color > "${report_dir}/compiled-doctor.log" 2>&1
          compiled_path_fixture="${GITHUB_WORKSPACE}/test/test-cases/validation/visuals/comic/fixtures/structured-script-parser/handler-precedence.md"
          docker run --rm --platform linux/amd64 --mount "type=bind,src=${compiled_path_fixture},dst=/benchmark/input.md,readonly" "${compiled_ref}" write /benchmark/input.md --price --no-color > "${report_dir}/compiled-paths.log" 2>&1
          grep -F 'Setup doctor:' "${report_dir}/compiled-doctor.log"
          grep -F 'Setup doctor completed' "${report_dir}/compiled-doctor.log"
          grep -F 'Estimate:' "${report_dir}/compiled-paths.log"
          grep -E 'Expected [0-9]+ files in ' "${report_dir}/compiled-paths.log"
          compiled_help_samples="$({ for _ in 1 2 3 4 5; do start="$(date +%s%N)"; docker run --rm --platform linux/amd64 "${compiled_ref}" --help >/dev/null; printf '%s\n' "$(( ($(date +%s%N) - start) / 1000000 ))"; done; } | jq -s '.')"
          compiled_peak_samples="$({ for _ in 1 2 3; do docker run --rm --platform linux/amd64 --entrypoint /bin/sh "${compiled_ref}" -c '/app/autoshow --help >/dev/null 2>&1; cat /sys/fs/cgroup/memory.peak'; done; } | jq -s '.')"
          jq -n \
            --arg platform linux/amd64 \
            --arg decision reject \
            --arg reason 'The production image remains source-run unless the compiled target materially improves startup and memory without increasing image size or weakening asset/path behavior.' \
            --argjson buildDurationMs "${compiled_build_duration_ms}" \
            --argjson imageSizeBytes "$(docker image inspect "${compiled_ref}" --format '{{.Size}}')" \
            --argjson sourceImageSizeBytes "$(docker image inspect "${image_ref}" --format '{{.Size}}')" \
            --argjson coldHelpWallMs "${compiled_help_samples}" \
            --argjson helpPeakRssBytes "${compiled_peak_samples}" \
            '{platform:$platform,target:"compiled-experiment",decision:$decision,reason:$reason,measurements:{buildDurationMs:$buildDurationMs,imageSizeBytes:$imageSizeBytes,sourceImageSizeBytes:$sourceImageSizeBytes,coldHelpWallMs:$coldHelpWallMs,helpPeakRssBytes:$helpPeakRssBytes}}' \
            > "${report_dir}/compiled-entrypoint-experiment.json"
          jq -n \
            --arg platform linux/amd64 \
            --arg digest "${IMAGE_DIGEST}" \
            --argjson buildDurationMs "${BUILD_DURATION_MS}" \
            --argjson imageSizeBytes "$(docker image inspect "${image_ref}" --format '{{.Size}}')" \
            --argjson helpSamples "${help_samples}" \
            --argjson prebuildSamples "${prebuild_samples}" \
            --arg fixtureSha256 "${fixture_sha256}" \
            --argjson fixturePeakSamples "${fixture_peak_samples}" \
            '{platform:$platform,digest:$digest,execution:"native GitHub runner",fixture:{path:"test/fixtures/setup/managed-toolchain-smoke.pdf",sha256:$fixtureSha256,workload:"local Tesseract OCR"},measurements:{buildDurationMs:$buildDurationMs,imageSizeBytes:$imageSizeBytes,coldHelpWallMs:$helpSamples,cliPrebuildMs:$prebuildSamples,fixturePeakRssBytes:$fixturePeakSamples}}' \
            > "${report_dir}/measurements.json"

      - name: Record the exact shipped image graph
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')@${IMAGE_DIGEST}"
          printf 'DEPENDENCY_SCAN_IMAGE=%s\n' "${image}" >> "${GITHUB_ENV}"
          docker image inspect "${image}" > runtime/ci/docker-amd64/image-identity.json
          docker run --rm --network none --entrypoint sh "${image}" -c 'dpkg-query -W -f="\${Package}\t\${Version}\t\${Architecture}\n"' > runtime/ci/docker-amd64/debian-packages.tsv
          docker run --rm --network none --entrypoint tar "${image}" -czf - /usr/share/doc > runtime/ci/docker-amd64/native-notices.tar.gz

      - name: Inventory the exact shipped image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.DEPENDENCY_SCAN_IMAGE }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: runtime/ci/docker-amd64/image.spdx.json
          upload-artifact: false

      - name: Audit the exact shipped image
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          sbom: runtime/ci/docker-amd64/image.spdx.json
          grype-version: v0.118.0
          output-format: json
          output-file: runtime/ci/docker-amd64/image-advisories.json
          fail-build: false
          severity-cutoff: high
      - name: Record dispositions for every high and critical advisory
        run: docker run --rm --network none --entrypoint bun --mount "type=bind,src=${GITHUB_WORKSPACE}/runtime/ci/docker-amd64,dst=/evidence,readonly" "${DEPENDENCY_SCAN_IMAGE}" --no-env-file src/tools/triage-image-advisories.ts /evidence --scan-name image-advisories.json > docs/reports/release-evidence/amd64/advisory-triage.json

      - name: Gate actionable high severity image findings
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          sbom: runtime/ci/docker-amd64/image.spdx.json
          grype-version: v0.118.0
          output-format: json
          output-file: runtime/ci/docker-amd64/image-advisories-fixable.json
          only-fixed: true
          severity-cutoff: high

      - name: Upload AMD64 verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-verification-amd64
          path: |
            runtime/ci/docker-amd64
            docs/reports/release-evidence/amd64
          if-no-files-found: error
          retention-days: 14

  build-arm64:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    if: github.event_name == 'push'
    needs:
      - verify
      - package-hygiene
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Fetch repository at the pushed commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          umask 077
          credential_helper="$(mktemp)"
          trap 'rm -f "$credential_helper"' EXIT
          cat > "$credential_helper" <<'HELPER'
          #!/bin/sh
          if [ "$1" = get ]; then
            printf 'username=x-access-token\npassword=%s\n' "$GITHUB_TOKEN"
          fi
          HELPER
          chmod 700 "$credential_helper"
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c "credential.helper=$credential_helper" fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Create Buildx builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          name: autoshow-builder
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push ARM64 image by digest
        id: build
        run: |
          set -euo pipefail
          started_ns="$(date +%s%N)"
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          created="$(git show -s --format=%cI "${GITHUB_SHA}")"
          version="$(jq -er '.version' package.json)"
          metadata_file="$(mktemp)"
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile \
            --build-arg "AUTOSHOW_VERSION=${version}" \
            --build-arg "BUILD_DATE=${created}" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${created}" \
            --provenance=mode=max \
            --sbom=true \
            --cache-from "type=registry,ref=${image}:buildcache-arm64" \
            --cache-from "type=registry,ref=${image}:buildcache" \
            --cache-to "type=registry,ref=${image}:buildcache-arm64,mode=max" \
            --output "type=image,name=${image},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "${metadata_file}" \
            .
          digest="$(jq -er '."containerimage.digest"' "${metadata_file}")"
          case "${digest}" in
            sha256:*) ;;
            *) printf 'Unexpected ARM64 image digest: %s\n' "${digest}" >&2; exit 1 ;;
          esac
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'build_duration_ms=%s\n' "$(( ($(date +%s%N) - started_ns) / 1000000 ))" >> "${GITHUB_OUTPUT}"

      - name: Smoke and measure ARM64 image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_DURATION_MS: ${{ steps.build.outputs.build_duration_ms }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_ref="${image}@${IMAGE_DIGEST}"
          report_dir="runtime/ci/docker-arm64"
          mkdir -p "${report_dir}"
          docker pull --platform linux/arm64 "${image_ref}" >/dev/null
          # Materialize lazy image layers before reading their sizes.
          test "$(docker run --rm --platform linux/arm64 --network none --entrypoint bun "${image_ref}" --version)" = "1.4.2"
          test "$(uname -m)" = "aarch64"
          test "$(docker info --format '{{.Architecture}}')" = "aarch64"
          mkdir -p docs/reports/release-evidence/arm64
          docker run --rm --platform linux/arm64 --network none --entrypoint bun --mount "type=bind,src=${GITHUB_WORKSPACE}/test/docker-acceptance/native-image-acceptance.ts,dst=/app/test/docker-acceptance/native-image-acceptance.ts,readonly" "${image_ref}" --no-env-file /app/test/docker-acceptance/native-image-acceptance.ts arm64 > docs/reports/release-evidence/arm64/rendering.log 2>&1
          jq -n --arg digest "${IMAGE_DIGEST}" --arg architecture arm64 '{digest:$digest,architecture:$architecture,native:true,network:"none",status:"passed"}' > docs/reports/release-evidence/arm64/native-acceptance.json
          docker history --no-trunc --human=false --format '{{json .}}' "${image_ref}" > "${report_dir}/image-history.jsonl"
          docker run --rm --platform linux/arm64 --entrypoint bun "${image_ref}" --no-env-file install --frozen-lockfile --production > "${report_dir}/production-install.log" 2>&1
          docker run --rm --platform linux/arm64 "${image_ref}" --help > "${report_dir}/help.log" 2>&1
          docker run --rm --platform linux/arm64 "${image_ref}" config --show --config-path /tmp/autoshow-smoke-config.json --no-color > "${report_dir}/config.log" 2>&1
          docker run --rm --platform linux/arm64 "${image_ref}" setup --doctor --no-color > "${report_dir}/doctor.log" 2>&1
          grep -F 'Setup doctor:' "${report_dir}/doctor.log"
          grep -F 'Setup doctor completed' "${report_dir}/doctor.log"
          help_samples="$({ for _ in 1 2 3 4 5; do start="$(date +%s%N)"; docker run --rm --platform linux/arm64 "${image_ref}" --help >/dev/null; printf '%s\n' "$(( ($(date +%s%N) - start) / 1000000 ))"; done; } | jq -s '.')"
          prebuild_samples="$({ for _ in 1 2 3 4 5; do docker run --rm --platform linux/arm64 --entrypoint bun "${image_ref}" --no-env-file -e 'const start=performance.now();const p=Bun.spawn(["bun","--no-env-file","build","/app/src/cli/create-cli.ts","--target=bun","--outfile","/tmp/autoshow-cli-ci.js"],{stdout:"ignore",stderr:"pipe"});const stderr=await new Response(p.stderr).text();const code=await p.exited;if(code!==0)throw new Error(stderr);console.log(performance.now()-start)'; done; } | jq -s '.')"
          fixture="${GITHUB_WORKSPACE}/test/fixtures/setup/managed-toolchain-smoke.pdf"
          fixture_sha256="$(sha256sum "${fixture}" | cut -d ' ' -f 1)"
          fixture_peak_samples="$({ for index in 1 2 3; do fixture_output="${RUNNER_TEMP}/autoshow-rss-arm64-${index}"; mkdir -p "${fixture_output}"; chmod 0777 "${fixture_output}"; docker run --rm --platform linux/arm64 --env NO_COLOR=1 --entrypoint /bin/sh --mount "type=bind,src=${fixture},dst=/benchmark/fixture.pdf,readonly" --mount "type=bind,src=${fixture_output},dst=/benchmark/output" "${image_ref}" -c 'set -eu; bun --no-env-file /app/src/cli/create-cli.ts extract /benchmark/fixture.pdf --provider tesseract --ocr-concurrency 1 --output-root /benchmark/output >/dev/null 2>&1; cat /sys/fs/cgroup/memory.peak'; done; } | jq -s '.')"
          compiled_ref="autoshow-compiled-experiment:${GITHUB_SHA}-arm64"
          compiled_started_ns="$(date +%s%N)"
          docker buildx build --platform linux/arm64 --target compiled-experiment --load --tag "${compiled_ref}" .
          compiled_build_duration_ms="$(( ($(date +%s%N) - compiled_started_ns) / 1000000 ))"
          docker run --rm --platform linux/arm64 "${compiled_ref}" --help > "${report_dir}/compiled-help.log" 2>&1
          docker run --rm --platform linux/arm64 "${compiled_ref}" config --show --config-path /tmp/autoshow-compiled-config.json --no-color > "${report_dir}/compiled-config.log" 2>&1
          docker run --rm --platform linux/arm64 "${compiled_ref}" setup --doctor --no-color > "${report_dir}/compiled-doctor.log" 2>&1
          compiled_path_fixture="${GITHUB_WORKSPACE}/test/test-cases/validation/visuals/comic/fixtures/structured-script-parser/handler-precedence.md"
          docker run --rm --platform linux/arm64 --mount "type=bind,src=${compiled_path_fixture},dst=/benchmark/input.md,readonly" "${compiled_ref}" write /benchmark/input.md --price --no-color > "${report_dir}/compiled-paths.log" 2>&1
          grep -F 'Setup doctor:' "${report_dir}/compiled-doctor.log"
          grep -F 'Setup doctor completed' "${report_dir}/compiled-doctor.log"
          grep -F 'Estimate:' "${report_dir}/compiled-paths.log"
          grep -E 'Expected [0-9]+ files in ' "${report_dir}/compiled-paths.log"
          compiled_help_samples="$({ for _ in 1 2 3 4 5; do start="$(date +%s%N)"; docker run --rm --platform linux/arm64 "${compiled_ref}" --help >/dev/null; printf '%s\n' "$(( ($(date +%s%N) - start) / 1000000 ))"; done; } | jq -s '.')"
          compiled_peak_samples="$({ for _ in 1 2 3; do docker run --rm --platform linux/arm64 --entrypoint /bin/sh "${compiled_ref}" -c '/app/autoshow --help >/dev/null 2>&1; cat /sys/fs/cgroup/memory.peak'; done; } | jq -s '.')"
          jq -n \
            --arg platform linux/arm64 \
            --arg decision reject \
            --arg reason 'The production image remains source-run unless the compiled target materially improves startup and memory without increasing image size or weakening asset/path behavior.' \
            --argjson buildDurationMs "${compiled_build_duration_ms}" \
            --argjson imageSizeBytes "$(docker image inspect "${compiled_ref}" --format '{{.Size}}')" \
            --argjson sourceImageSizeBytes "$(docker image inspect "${image_ref}" --format '{{.Size}}')" \
            --argjson coldHelpWallMs "${compiled_help_samples}" \
            --argjson helpPeakRssBytes "${compiled_peak_samples}" \
            '{platform:$platform,target:"compiled-experiment",decision:$decision,reason:$reason,measurements:{buildDurationMs:$buildDurationMs,imageSizeBytes:$imageSizeBytes,sourceImageSizeBytes:$sourceImageSizeBytes,coldHelpWallMs:$coldHelpWallMs,helpPeakRssBytes:$helpPeakRssBytes}}' \
            > "${report_dir}/compiled-entrypoint-experiment.json"
          jq -n \
            --arg platform linux/arm64 \
            --arg digest "${IMAGE_DIGEST}" \
            --argjson buildDurationMs "${BUILD_DURATION_MS}" \
            --argjson imageSizeBytes "$(docker image inspect "${image_ref}" --format '{{.Size}}')" \
            --argjson helpSamples "${help_samples}" \
            --argjson prebuildSamples "${prebuild_samples}" \
            --arg fixtureSha256 "${fixture_sha256}" \
            --argjson fixturePeakSamples "${fixture_peak_samples}" \
            '{platform:$platform,digest:$digest,execution:"native GitHub runner",fixture:{path:"test/fixtures/setup/managed-toolchain-smoke.pdf",sha256:$fixtureSha256,workload:"local Tesseract OCR"},measurements:{buildDurationMs:$buildDurationMs,imageSizeBytes:$imageSizeBytes,coldHelpWallMs:$helpSamples,cliPrebuildMs:$prebuildSamples,fixturePeakRssBytes:$fixturePeakSamples}}' \
            > "${report_dir}/measurements.json"

      - name: Record the exact shipped image graph
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')@${IMAGE_DIGEST}"
          printf 'DEPENDENCY_SCAN_IMAGE=%s\n' "${image}" >> "${GITHUB_ENV}"
          docker image inspect "${image}" > runtime/ci/docker-arm64/image-identity.json
          docker run --rm --network none --entrypoint sh "${image}" -c 'dpkg-query -W -f="\${Package}\t\${Version}\t\${Architecture}\n"' > runtime/ci/docker-arm64/debian-packages.tsv
          docker run --rm --network none --entrypoint tar "${image}" -czf - /usr/share/doc > runtime/ci/docker-arm64/native-notices.tar.gz

      - name: Inventory the exact shipped image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.DEPENDENCY_SCAN_IMAGE }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: runtime/ci/docker-arm64/image.spdx.json
          upload-artifact: false

      - name: Audit the exact shipped image
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          sbom: runtime/ci/docker-arm64/image.spdx.json
          grype-version: v0.118.0
          output-format: json
          output-file: runtime/ci/docker-arm64/image-advisories.json
          fail-build: false
          severity-cutoff: high
      - name: Record dispositions for every high and critical advisory
        run: docker run --rm --network none --entrypoint bun --mount "type=bind,src=${GITHUB_WORKSPACE}/runtime/ci/docker-arm64,dst=/evidence,readonly" "${DEPENDENCY_SCAN_IMAGE}" --no-env-file src/tools/triage-image-advisories.ts /evidence --scan-name image-advisories.json > docs/reports/release-evidence/arm64/advisory-triage.json

      - name: Gate actionable high severity image findings
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          sbom: runtime/ci/docker-arm64/image.spdx.json
          grype-version: v0.118.0
          output-format: json
          output-file: runtime/ci/docker-arm64/image-advisories-fixable.json
          only-fixed: true
          severity-cutoff: high

      - name: Upload ARM64 verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-verification-arm64
          path: |
            runtime/ci/docker-arm64
            docs/reports/release-evidence/arm64
          if-no-files-found: error
          retention-days: 14

  publish-manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs:
      - build-amd64
      - build-arm64
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Create and verify multi-arch manifest
        id: publish
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:${GITHUB_SHA}" \
            "${image}@${AMD64_DIGEST}" \
            "${image}@${ARM64_DIGEST}"
          manifest="$(docker buildx imagetools inspect --raw "${image}:${GITHUB_SHA}")"
          printf '%s' "${manifest}" | jq -e '
            [.manifests[] | select(.platform.os == "linux") | .platform.architecture]
            | index("amd64") != null and index("arm64") != null
          ' >/dev/null
          docker buildx imagetools inspect "${image}:${GITHUB_SHA}"
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${image}:latest")"
          test "${#digest}" = 71
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

  acceptance:
    name: GHCR acceptance (${{ matrix.arch }}, ${{ matrix.shard }})
    needs: publish-manifest
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        shard: [core, network, 'whisperfile:tiny', 'whisperfile:tiny.en', 'whisperfile:small', 'whisperfile:small.en']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install supported Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install frozen dependencies
        run: bun --no-env-file install --frozen-lockfile

      - name: Restore local assets
        id: assets
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: runtime/docker-acceptance/cache
          key: docker-local-v1-${{ matrix.arch }}-${{ matrix.shard }}-${{ hashFiles('Dockerfile', 'src/cli/commands/setup-and-utilities/**', 'src/cli/commands/stt/local/**', 'src/cli/commands/text/url/url-local/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: docker-local-v1-${{ matrix.arch }}-${{ matrix.shard }}-${{ hashFiles('Dockerfile', 'src/cli/commands/setup-and-utilities/**', 'src/cli/commands/stt/local/**', 'src/cli/commands/text/url/url-local/**') }}-

      - name: Accept published latest through its CLI
        env:
          SHARD: ${{ matrix.shard }}
          PLATFORM: linux/${{ matrix.arch }}
          EXPECTED_DIGEST: ${{ needs.publish-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "${SHARD}" = core ] || [ "${SHARD}" = network ]; then
            set -- --suite "${SHARD}"
          else
            set -- --suite models --model "${SHARD}"
          fi
          bun t:docker "$@" --platform "${PLATFORM}" \
            --expected-digest "${EXPECTED_DIGEST}" --expected-revision "${GITHUB_SHA}" \
            --output runtime/docker-acceptance/evidence

      - name: Make local assets readable for archiving
        if: always()
        run: |
          if [ -d runtime/docker-acceptance/cache ]; then
            sudo chown -R "$(id -u):$(id -g)" runtime/docker-acceptance/cache
          fi

      - name: Retain local assets even after failure
        if: always() && steps.assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: runtime/docker-acceptance/cache
          key: ${{ steps.assets.outputs.cache-primary-key }}

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghcr-acceptance-${{ matrix.arch }}-${{ strategy.job-index }}
          path: runtime/docker-acceptance/evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  acceptance-required:
    name: Published latest acceptance
    if: always() && github.event_name == 'push'
    needs: [publish-manifest, acceptance]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native shard
        env:
          PUBLICATION: ${{ needs.publish-manifest.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
        run: |
          if [ "${PUBLICATION}" != success ] || [ "${ACCEPTANCE}" != success ]; then
            printf 'Publication: %s; acceptance: %s. Inspect job evidence; this check does not roll back or retag latest.\n' "${PUBLICATION}" "${ACCEPTANCE}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          printf '%s\n' 'All core, model, and public-network cases passed on native AMD64 and ARM64.' >> "${GITHUB_STEP_SUMMARY}"
