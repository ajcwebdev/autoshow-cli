name: Audit native production image
description: Inventory and scan the exact native image digest and retain complete advisory dispositions.
inputs:
  arch:
    description: Native runner architecture (amd64 or arm64)
    required: true
  digest:
    description: Exact per-architecture index digest
    required: true
runs:
  using: composite
  steps:
    - name: Record the exact shipped image graph
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        IMAGE_DIGEST: ${{ inputs.digest }}
      run: |
        set -euo pipefail
        case "${ARCH}" in amd64|arm64) ;; *) exit 1 ;; esac
        [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Missing native image digest' >&2; exit 1; }
        image="$(bash src/tools/docker-image-name.sh)@${IMAGE_DIGEST}"
        printf 'DEPENDENCY_SCAN_IMAGE=%s\n' "${image}" >> "${GITHUB_ENV}"
        mkdir -p "runtime/ci/docker-${ARCH}" "docs/reports/release-evidence/${ARCH}"
        docker pull --platform "linux/${ARCH}" "${image}" >/dev/null
        IMAGE_REFERENCE="${image}" EVIDENCE_DIR="runtime/ci/docker-${ARCH}" bash src/tools/docker-capture-native-evidence.sh
    - name: Install supported host Bun for runtime state acceptance
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - name: Install frozen production graph for the acceptance host
      shell: bash
      run: bun --no-env-file install --frozen-lockfile --production --omit=peer
    - name: Verify persistent state and restricted runtime offline
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: bun --no-env-file test/docker-acceptance/docker-runtime-state-acceptance.ts --image "${DEPENDENCY_SCAN_IMAGE}" --output "runtime/ci/docker-${ARCH}/runtime-state"
    - name: Inventory, audit, and gate the exact shipped image
      uses: ./.github/actions/scan-image
      with:
        image: ${{ env.DEPENDENCY_SCAN_IMAGE }}
        evidence-dir: runtime/ci/docker-${{ inputs.arch }}
    - name: Record dispositions for every high and critical advisory
      if: always() && env.DEPENDENCY_SCAN_IMAGE != ''
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: docker run --rm --platform "linux/${ARCH}" --network none --entrypoint bun --mount "type=bind,src=${GITHUB_WORKSPACE}/runtime/ci/docker-${ARCH},dst=/evidence,readonly" "${DEPENDENCY_SCAN_IMAGE}" --no-env-file src/tools/triage-image-advisories.ts /evidence --scan-name image-advisories.json > "docs/reports/release-evidence/${ARCH}/advisory-triage.json"
