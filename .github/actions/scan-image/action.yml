name: Scan image
description: Inventory an image once with Syft, audit it once with a date-cached Grype database, and gate on fixable findings derived from that single scan.
inputs:
  image:
    description: Image reference to inventory (mutually exclusive with sbom)
    default: ''
  sbom:
    description: Existing SPDX JSON to scan instead of an image
    default: ''
  evidence-dir:
    description: Directory receiving image.spdx.json, image-advisories.json, image-advisories-fixable.json, and grype-db.json
    required: true
  cache-key-salt:
    description: Extra Grype database cache key discriminator
    default: ''
  syft-version:
    description: Syft release used for the inventory
    default: v1.55.0
  grype-version:
    description: Grype release used for the audit
    default: v0.121.0
  severity-cutoff:
    description: Lowest severity that gates
    default: high
  fail-on-fixable:
    description: Fail when fixable findings at or above severity-cutoff exist
    default: 'true'
outputs:
  fixable-count:
    description: Number of fixable findings at or above the cutoff
    value: ${{ steps.gate.outputs.fixable-count }}
  db-built:
    description: Build timestamp of the vulnerability database used
    value: ${{ steps.gate.outputs.db-built }}
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      env:
        EVIDENCE_DIR: ${{ inputs.evidence-dir }}
        IMAGE: ${{ inputs.image }}
        SBOM: ${{ inputs.sbom }}
      run: |
        set -euo pipefail
        test -n "${IMAGE}${SBOM}" || { echo 'scan-image: provide image or sbom' >&2; exit 1; }
        { test -z "${IMAGE}" || test -z "${SBOM}"; } || { echo 'scan-image: image and sbom are mutually exclusive' >&2; exit 1; }
        mkdir -p "${EVIDENCE_DIR}"
        printf 'sbom=%s\n' "${SBOM:-${EVIDENCE_DIR}/image.spdx.json}" >> "${GITHUB_OUTPUT}"
    - name: Install required scanners
      shell: bash
      env:
        SYFT_VERSION: ${{ inputs.syft-version }}
        GRYPE_VERSION: ${{ inputs.grype-version }}
        INSTALL_SYFT: ${{ inputs.image != '' }}
      run: bash "${GITHUB_ACTION_PATH}/install-scan-tools.sh"
    - name: Inventory the image
      if: inputs.image != ''
      shell: bash
      env:
        # Mitigate the reviewed stdlib HTTP/2 paths until vendor binaries use patched Go.
        GODEBUG: http2client=0,http2server=0
        IMAGE: ${{ inputs.image }}
        SBOM: ${{ steps.paths.outputs.sbom }}
      run: |
        set -euo pipefail
        syft "${IMAGE}" -o "spdx-json=${SBOM}"
    - name: Prepare the Grype vulnerability database
      id: grype-db
      uses: ./.github/actions/prepare-grype-db
      with:
        evidence-dir: ${{ inputs.evidence-dir }}
        grype-version: ${{ inputs.grype-version }}
        cache-key-salt: ${{ inputs.cache-key-salt }}
        install-grype: 'false'
    - name: Audit the image
      shell: bash
      env:
        GODEBUG: http2client=0,http2server=0
        GRYPE_DB_CACHE_DIR: ${{ steps.grype-db.outputs.db-dir }}
        GRYPE_DB_AUTO_UPDATE: 'false'
        GRYPE_DB_VALIDATE_AGE: 'true'
        GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
        GRYPE_DB_VALIDATE_BY_HASH_ON_START: 'true'
        SBOM: ${{ steps.paths.outputs.sbom }}
        OUTPUT: ${{ inputs.evidence-dir }}/image-advisories.json
      run: |
        set -euo pipefail
        grype "sbom:${SBOM}" -o json --file "${OUTPUT}"
    - name: Gate actionable high severity image findings
      id: gate
      shell: bash
      env:
        EVIDENCE_DIR: ${{ inputs.evidence-dir }}
        SEVERITY_CUTOFF: ${{ inputs.severity-cutoff }}
        FAIL_ON_FIXABLE: ${{ inputs.fail-on-fixable }}
      run: |
        set -euo pipefail
        scan="${EVIDENCE_DIR}/image-advisories.json"
        fixable="${EVIDENCE_DIR}/image-advisories-fixable.json"
        jq -e '.matches | type == "array"' "${scan}" >/dev/null
        jq -f "${GITHUB_ACTION_PATH}/fixable.jq" "${scan}" > "${fixable}"
        jq -c '.descriptor.db // {}' "${scan}" > "${EVIDENCE_DIR}/grype-db.json"
        count="$(jq --arg cutoff "${SEVERITY_CUTOFF}" -f "${GITHUB_ACTION_PATH}/gate-count.jq" "${fixable}")"
        printf 'fixable-count=%s\n' "${count}" >> "${GITHUB_OUTPUT}"
        printf 'db-built=%s\n' "$(jq -r '.descriptor.db.built // .descriptor.db.status.built // "unknown"' "${scan}")" >> "${GITHUB_OUTPUT}"
        if [ "${count}" -gt 0 ]; then
          jq -r --arg cutoff "${SEVERITY_CUTOFF}" 'def rank: {"negligible":1,"low":2,"medium":3,"high":4,"critical":5}[ascii_downcase] // 0; .matches[] | select((.vulnerability.severity // "unknown" | rank) >= ($cutoff | rank)) | "\(.vulnerability.severity)\t\(.vulnerability.id)\t\(.artifact.name)@\(.artifact.version)\tfixed in \(.vulnerability.fix.versions | join(", "))"' "${fixable}" | sort -u
          if [ "${FAIL_ON_FIXABLE}" = true ]; then printf '%s fixable finding(s) at or above %s\n' "${count}" "${SEVERITY_CUTOFF}" >&2; exit 1; fi
        fi
